<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SkillSwap – Swipe Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="brand">
          <span class="logo">⇄</span>
          <span class="title">SkillSwap</span>
        </div>
      </header>

      <main class="stage">
        <div id="deck" class="deck" aria-live="polite"></div>
        <div id="empty-state" class="empty hidden">
          <div class="empty-card">
            <div class="empty-title">You're all caught up</div>
            <div class="empty-subtitle">Check back later for more matches.</div>
          </div>
        </div>
      </main>

      <footer class="controls">
        <button id="passBtn" class="btn btn-pass" aria-label="Pass">✖</button>
        <button id="likeBtn" class="btn btn-like" aria-label="Like">❤</button>
      </footer>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
